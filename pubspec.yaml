name: ym_geolocator
description: Geolocation plugin for Flutter. This plugin provides a cross-platform (iOS, Android) API for generic location (GPS etc.) functions.
repository: https://github.com/yashmanghnani/ym_geolocator
issue_tracker: https://github.com/yashmanghnani/ym_geolocator/issues
version: 14.0.2

environment:
  sdk: ^3.7.2
  flutter: ">=2.8.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: geolocator_android
      ios:
        default_package: geolocator_apple
      macos:
        default_package: geolocator_apple
      web:
        default_package: geolocator_web
      windows:
        default_package: geolocator_windows
      linux:
        default_package: geolocator_linux

dependencies:
  flutter:
    sdk: flutter

  geolocator_platform_interface: ^4.2.3
  ym_geolocator_android: ^0.0.2
  geolocator_apple: ^2.3.8
  geolocator_web: ^4.1.1
  geolocator_windows: ^0.2.3
  geolocator_linux: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.0.0-nullsafety.7
  plugin_platform_interface: ^2.1.8
